name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Run backend tests
        working-directory: backend
        run: go test -v ./...
      - name: Static analysis
        working-directory: backend
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check ui/app.js
  svn-integration:
    name: SVN real repository integration (required for packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBX_REQUIRE_SVN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install and verify Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
          svn --version --quiet
          svnadmin --version --quiet
      - name: Test real SVN repository (no skips)
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -json -run '^TestWriteSVN$' ./... | tee svn-test.jsonl
          python3 - <<'PY'
          import json
          with open('svn-test.jsonl') as f:
              events = [json.loads(line) for line in f if line.strip()]
          assert not any(e.get('Action') == 'skip' for e in events), 'SVN test skipped'
          assert any(e.get('Action') == 'pass' and e.get('Test') == 'TestWriteSVN' for e in events), 'Missing SVN PASS'
          print('Confirmed: real SVN integration passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svn-integration-report
          path: backend/svn-test.jsonl
          if-no-files-found: warn
  windows-package:
    needs: [backend, svn-integration]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package unsigned DBX candidate
        shell: pwsh
        run: |
          npm install --global @dbx-app/plugin-cli@0.1.10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dbx-plugin --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dbx-plugin package .

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = Get-Item dist/io.github.code-new-bie.vcs-0.2.1-windows-x64.dbxp -ErrorAction Stop
          $metadata = Get-Item dist/io.github.code-new-bie.vcs-0.2.1-windows-x64.artifact.json -ErrorAction Stop
          $pkg | Select-Object Name,Length
          Get-FileHash $pkg.FullName -Algorithm SHA256
          Get-Content $metadata.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-vcs-windows-x64-unsigned
          path: |
            dist/*.dbxp
            dist/*.artifact.json
          if-no-files-found: error
