<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCS Manager</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>VCS Manager</strong><span id="tools">正在连接 DBX…</span><span class="pill">开发版 · 0.2.0</span></header>
<form id="add"><select id="kind" aria-label="仓库类型"><option value="git">Git</option><option value="svn">SVN</option></select><input id="path" aria-label="仓库绝对路径" placeholder="输入可信本地工作区绝对路径" required><button>添加仓库</button></form>
<div id="notice" role="status" aria-live="polite"></div>
<main><aside><h3>仓库</h3><div id="repos"></div></aside><section><nav><button id="refresh">工作区变更</button><button id="history">历史记录</button><button id="branches">Git 分支</button><button id="allDiff">全部 Diff</button></nav><h3 id="title">请选择仓库</h3><div id="operations" class="operations" hidden><p id="selection">未选择文件</p><div id="actions"></div><section id="confirmation" hidden><strong>确认版本控制操作</strong><pre id="summary"></pre><label id="messageLabel" hidden>提交说明<textarea id="message" maxlength="8192" rows="3"></textarea></label><label><input id="ack" type="checkbox"> 我确认仓库、操作及影响范围</label><div><button id="execute" disabled>执行操作</button><button id="cancel">取消</button></div></section></div><div id="changes"></div><pre id="output">添加本地 Git 或 SVN 工作区以开始。</pre></section></main>
<script src="app.js"></script></body></html>
